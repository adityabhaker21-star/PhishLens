<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PhishLens Security</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      width: 360px;
      background: #0f172a;
      color: #f8fafc;
      padding: 16px;
      font-size: 13px;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 12px;
      border-bottom: 1px solid #1e293b;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-icon {
      width: 24px;
      height: 24px;
      color: #38bdf8;
    }

    .brand-name {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: #ffffff;
    }

    .status-pill {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 9999px;
      background: #1e293b;
      color: #94a3b8;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #22c55e;
    }

    /* Score Card */
    .score-card {
      margin-top: 14px;
      background: #1e293b;
      border-radius: 10px;
      padding: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border: 1px solid #334155;
    }

    .score-left {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .score-label {
      font-size: 11px;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .score-value-row {
      display: flex;
      align-items: baseline;
      gap: 4px;
    }

    .score-num {
      font-size: 28px;
      font-weight: 800;
      line-height: 1;
    }

    .score-total {
      font-size: 13px;
      color: #64748b;
    }

    .verdict-badge {
      padding: 6px 12px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .verdict-safe {
      background: rgba(34, 197, 94, 0.15);
      color: #4ade80;
      border: 1px solid rgba(34, 197, 94, 0.3);
    }

    .verdict-suspicious {
      background: rgba(234, 179, 8, 0.15);
      color: #facc15;
      border: 1px solid rgba(234, 179, 8, 0.3);
    }

    .verdict-danger {
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }

    .url-preview {
      margin-top: 10px;
      font-size: 11px;
      color: #94a3b8;
      word-break: break-all;
      background: #141f36;
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid #1e293b;
    }

    /* Section Styling */
    .section-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #94a3b8;
      margin-top: 16px;
      margin-bottom: 8px;
      font-weight: 600;
    }

    .signals-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 170px;
      overflow-y: auto;
    }

    .signal-item {
      background: #1e293b;
      padding: 8px 10px;
      border-radius: 6px;
      display: flex;
      align-items: flex-start;
      gap: 8px;
      font-size: 12px;
      line-height: 1.35;
      border: 1px solid #283548;
    }

    .signal-points {
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(239, 68, 68, 0.2);
      color: #fca5a5;
      font-weight: 700;
      font-size: 11px;
      flex-shrink: 0;
    }

    .signal-detail {
      color: #e2e8f0;
    }

    /* AI Advice Box */
    .ai-box {
      margin-top: 14px;
      background: #1e293b;
      border-left: 3px solid #38bdf8;
      border-radius: 6px;
      padding: 10px 12px;
      font-size: 12px;
      line-height: 1.4;
    }

    .ai-header {
      font-weight: 700;
      color: #38bdf8;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .ai-advice {
      color: #e2e8f0;
    }

    /* Empty state */
    .empty-state {
      padding: 24px 12px;
      text-align: center;
      color: #94a3b8;
      font-size: 12px;
      line-height: 1.5;
    }

    .empty-icon {
      width: 36px;
      height: 36px;
      color: #475569;
      margin-bottom: 8px;
    }

    /* Footer actions */
    .footer-actions {
      margin-top: 16px;
      display: flex;
      gap: 8px;
    }

    .btn-action {
      flex: 1;
      padding: 8px 12px;
      border-radius: 6px;
      background: #334155;
      color: #f8fafc;
      border: none;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.15s ease;
    }

    .btn-action:hover {
      background: #475569;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 2L3 7v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V7l-9-5z" />
        <circle cx="12" cy="12" r="3" fill="currentColor" />
      </svg>
      <span class="brand-name">PhishLens</span>
    </div>
    <div class="status-pill">
      <span class="status-dot"></span>
      <span>Shield Active</span>
    </div>
  </div>

  <div id="scan-container">
    <div class="score-card">
      <div class="score-left">
        <span class="score-label">Phishing Risk Score</span>
        <div class="score-value-row">
          <span class="score-num" id="score-num">--</span>
          <span class="score-total">/ 100</span>
        </div>
      </div>
      <div class="verdict-badge" id="verdict-badge">Scanning</div>
    </div>

    <div class="url-preview" id="url-preview">Checking current tab...</div>

    <div class="section-title">Triggered Signals</div>
    <ul class="signals-list" id="signals-list">
      <li class="signal-item">
        <span class="signal-detail">No signals triggered yet.</span>
      </li>
    </ul>

    <div class="ai-box" id="ai-box" style="display: none;">
      <div class="ai-header">
        <span>AI Phishing Analysis</span>
      </div>
      <div class="ai-advice" id="ai-advice"></div>
    </div>
  </div>

  <div class="empty-state" id="empty-state" style="display: none;">
    <svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
      <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
      <path d="M7 11V7a5 5 0 0 1 10 0v4" />
    </svg>
    <div>No password input detected on this tab.</div>
    <div style="font-size: 11px; margin-top: 4px; color: #64748b;">PhishLens triggers automatically when credentials could be entered.</div>
  </div>

  <div class="footer-actions">
    <button class="btn-action" id="btn-rescan">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
      </svg>
      Re-scan
    </button>
    <button class="btn-action" id="btn-dashboard">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
      </svg>
      Events Log
    </button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
